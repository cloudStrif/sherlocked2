<div class="fixed inset-0 z-50 flex items-center justify-center p-2 sm:p-4 bg-black/90 backdrop-blur-xl animate-in fade-in duration-200">
  <div class="relative w-full max-w-2xl bg-gray-950 border border-cyan-500/40 rounded-3xl shadow-[0_0_60px_rgba(6,182,212,0.3)] overflow-hidden flex flex-col">
    
    <!-- Header Viseur -->
    <div class="px-5 py-3 border-b border-gray-800/80 bg-gray-950/80 flex items-center justify-between">
      <div class="flex items-center gap-2">
        <span class="w-2.5 h-2.5 rounded-full bg-rose-500 animate-ping"></span>
        <span class="text-xs font-mono font-bold text-white tracking-widest uppercase">Palais Mental // Viseur Optique Direct</span>
      </div>
      <button
        type="button"
        (click)="onClose()"
        class="text-gray-400 hover:text-white p-1 rounded-xl hover:bg-gray-800 transition-colors cursor-pointer"
      >
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>
    </div>

    <!-- Zone Vidéo / Viseur -->
    <div class="relative w-full aspect-video sm:aspect-[4/3] bg-black overflow-hidden flex items-center justify-center">
      
      <!-- Balise Vidéo Directe -->
      <video
        #videoElement
        autoplay
        playsinline
        muted
        class="w-full h-full object-cover"
        [class.hidden]="!isStreaming()"
      ></video>

      <!-- Message d'Erreur Caméra si refus ou absent -->
      @if (errorMessage()) {
        <div class="p-6 text-center max-w-sm space-y-4">
          <div class="w-12 h-12 mx-auto rounded-full bg-rose-950/80 border border-rose-500/50 flex items-center justify-center text-rose-300">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
            </svg>
          </div>
          <p class="text-xs font-mono text-rose-200">{{ errorMessage() }}</p>
          <button
            type="button"
            (click)="startCamera()"
            class="px-4 py-2 rounded-xl bg-gray-800 hover:bg-gray-700 text-xs font-mono text-cyan-300 border border-cyan-500/40 cursor-pointer"
          >
            Réessayer l'accès caméra
          </button>
        </div>
      }

      <!-- HUD et Réticules Cyber-Sherlock au-dessus de la vidéo -->
      @if (isStreaming()) {
        <div class="absolute inset-0 pointer-events-none p-4 flex flex-col justify-between">
          <!-- Coins de cadrage (┌ ┐ └ ┘) -->
          <span class="absolute top-4 left-4 w-6 h-6 border-t-2 border-l-2 border-cyan-400 shadow-[0_0_10px_#22d3ee]"></span>
          <span class="absolute top-4 right-4 w-6 h-6 border-t-2 border-r-2 border-cyan-400 shadow-[0_0_10px_#22d3ee]"></span>
          <span class="absolute bottom-4 left-4 w-6 h-6 border-b-2 border-l-2 border-cyan-400 shadow-[0_0_10px_#22d3ee]"></span>
          <span class="absolute bottom-4 right-4 w-6 h-6 border-b-2 border-r-2 border-cyan-400 shadow-[0_0_10px_#22d3ee]"></span>

          <!-- Grille subtile -->
          <div class="absolute inset-0 bg-[radial-gradient(#06b6d4_0.75px,transparent_0.75px)] bg-[size:24px_24px] opacity-20"></div>

          <!-- Ligne laser de balayage continue -->
          <div class="absolute inset-x-0 h-0.5 bg-gradient-to-r from-transparent via-cyan-400 to-transparent shadow-[0_0_15px_#22d3ee] animate-pulse"></div>

          <!-- Réticule central d'analyse -->
          <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-20 h-20 rounded-full border border-dashed border-cyan-400/60 flex items-center justify-center animate-spin" style="animation-duration: 12s;">
            <div class="w-2 h-2 rounded-full bg-cyan-400 shadow-[0_0_10px_#22d3ee]"></div>
          </div>

          <div class="relative z-10 flex items-center justify-between text-[10px] font-mono text-cyan-300/80">
            <span>RES: 1080P // OPTIQUE ACTIF</span>
            <span>SHERLOCK FOCUS: LOCK</span>
          </div>

          <div class="relative z-10 text-center">
            <span class="inline-block px-3 py-1 rounded-full bg-black/60 backdrop-blur-md border border-cyan-500/40 text-[11px] font-mono text-cyan-200">
              Cadrez l'objet ou la personne à déduire
            </span>
          </div>
        </div>
      }
    </div>

    <!-- Barre de Contrôles & Déclencheur -->
    <div class="p-4 bg-gray-950 flex items-center justify-around gap-4 border-t border-gray-800">
      
      <!-- Bouton Changer de caméra (Selfie / Arrière) -->
      <button
        type="button"
        (click)="switchCamera()"
        class="p-3 rounded-2xl bg-gray-900 hover:bg-gray-800 text-gray-300 hover:text-cyan-300 border border-gray-800 transition-all cursor-pointer"
        title="Changer de caméra"
      >
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
        </svg>
      </button>

      <!-- Gros Bouton Déclencheur (Prendre la photo) -->
      <button
        type="button"
        (click)="capturePhoto()"
        [disabled]="!isStreaming()"
        class="group relative flex items-center justify-center p-2 rounded-full bg-gray-900 border-2 border-cyan-400 shadow-[0_0_30px_rgba(6,182,212,0.5)] hover:scale-105 active:scale-95 transition-all cursor-pointer disabled:opacity-40 disabled:cursor-not-allowed"
      >
        <div class="w-16 h-16 rounded-full bg-gradient-to-tr from-cyan-400 to-teal-300 group-hover:from-cyan-300 group-hover:to-teal-200 flex items-center justify-center shadow-inner">
          <svg class="w-7 h-7 text-gray-950" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z" />
          </svg>
        </div>
      </button>

      <!-- Bouton Annuler -->
      <button
        type="button"
        (click)="onClose()"
        class="px-4 py-2.5 rounded-2xl bg-gray-900 hover:bg-gray-800 text-xs font-mono text-gray-400 hover:text-white border border-gray-800 transition-colors cursor-pointer"
      >
        Fermer
      </button>

    </div>

  </div>
</div>
